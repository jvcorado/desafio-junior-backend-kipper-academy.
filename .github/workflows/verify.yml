name: Verificar backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kipper_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d kipper_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
      - run: ./mvnw -B test
        env:
          TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/kipper_test
          TEST_DATABASE_USER: test
          TEST_DATABASE_PASSWORD: test-only-password
      - run: python3 -m unittest discover -s integrations/hermes -p 'test_*.py' -v
