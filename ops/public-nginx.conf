worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_origin $reject_origin {
        default 1;
        "" 0;
        "https://kipper.jayv.cloud" 0;
    }
    server {
        listen 127.0.0.1:18083;
        server_name kipper.jayv.cloud;
        client_max_body_size 64k;
        add_header Strict-Transport-Security "max-age=31536000" always;
        if ($host != "kipper.jayv.cloud") { return 421; }
        if ($reject_origin) { return 403; }
        # Transport ingress stays private, with its separate Bearer credential.
        location = /api/events { return 403; }
        location / {
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Host "localhost:18080";
            # Normalize only after the original public origin passed the check above.
            proxy_set_header Origin "http://localhost:18080";
            proxy_set_header Authorization "";
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 360s;
            proxy_redirect http://localhost:18080/ https://kipper.jayv.cloud/;
        }
    }
}
